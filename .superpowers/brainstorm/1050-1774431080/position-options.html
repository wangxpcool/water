<h2>图表放在哪里？</h2>
<p class="subtitle">选择趋势图在页面中的位置</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>顶部指标卡下方</h3>
      <p>占用 hero 区域，展示近期 6-12 个月的净资产趋势</p>
    </div>
  </div>

  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>首页顶部独立卡片</h3>
      <p>在现有 4 个指标卡下方加一个图表卡片</p>
    </div>
  </div>

  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>点击快照列表后显示</h3>
      <p>在展开的快照详情里显示趋势图</p>
    </div>
  </div>

  <div class="option" data-choice="d" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>单独可视化区域</h3>
      <p>把 hero 区改为图表为主的布局，指标卡放到旁边</p>
    </div>
  </div>
</div>
