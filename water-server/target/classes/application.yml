spring:
  application:
    name: water-server
  datasource:
    url: jdbc:sqlite:../water.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always

server:
  port: 8080

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
